name: 🚀 Portfolio CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Allow this workflow to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deploy at a time; don't cancel a run mid-deploy
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:

  # ============================
  # 🧪 CI PHASE (CHECK CODE)
  # ============================
  ci:
    name: 🧪 CI - Code Validation
    runs-on: ubuntu-latest

    steps:
      # Step 1: Get code from GitHub
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # Step 2: Setup Node (needed for tools)
      - name: 🟢 Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Step 3: Install validation tools
      - name: 📦 Install Tools
        run: |
          npm init -y
          npm install htmlhint --save-dev

      # Step 4: Validate HTML (won't fail the build, just reports)
      - name: ✅ Check HTML
        run: npx htmlhint "**/*.html" || true


  # ============================
  # 📦 BUILD PHASE
  # ============================
  build:
    name: 📦 Build Application
    runs-on: ubuntu-latest
    needs: ci   # Only run if CI is successful

    steps:
      # Step 1: Get code again
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # Step 2: Create production folder
      - name: 📦 Prepare Build
        run: |
          mkdir dist
          rsync -av \
            --exclude=dist \
            --exclude=.git \
            --exclude=.github \
            --exclude=.claude \
            ./ dist/

      # Step 3: Upload the built site for the deploy job
      - name: 📤 Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist


  # ============================
  # 🚀 CD PHASE (DEPLOY)
  # ============================
  deploy:
    name: 🚀 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build   # Only run if Build is successful
    # Only deploy on a push to main, never on pull requests
    if: github.event_name == 'push'

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      # Step 1: Configure GitHub Pages
      - name: ⚙️ Setup Pages
        uses: actions/configure-pages@v4

      # Step 2: Deploy the uploaded artifact
      - name: 🚀 Deploy
        id: deploy
        uses: actions/deploy-pages@v4

      # Step 3: Show live website link
      - name: 🌐 Show Live URL
        run: |
          echo "🎉 Deployment Successful!"
          echo "🌍 Website URL: ${{ steps.deploy.outputs.page_url }}"
